<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brochure cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0658fa;
    --purple: #8000ff;
    --black: #000000;
    --bg-grey: #ecedf0;
    --white: #ffffff;
    --text-grey: #7f7f7f;
    --border: #d4d6dc;

    /*
     * --cover-bg: bottom section colour. Set to the correct value for the module category.
     *
     * Risk modules    (ERM, ISMS, TPRM, OpRes, DORA, MRM, RMIS):  #F4F8FF
     * Compliance modules (DP, PM, RCM, CM, COM, RR, HS, CI, PG,
     *                     SMCR, GH, LP):                           #F8F1FF
     * Audit modules   (IA, QA, SOX):                               #F6F6FA
     */
    --cover-bg: #F4F8FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #d0d0d0;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── Page shell ─────────────────────────────────────── */

  .page-wrapper {
    width: 794px;
    height: 1123px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  .page {
    width: 794px;
    height: 1123px;
    position: relative;
    overflow: hidden;
    background: var(--white);
    display: flex;
    flex-direction: column;
  }

  /* ─── Top white section (47.5% = 533px) ─────────────── */

  .page-top {
    height: 533px;
    flex-shrink: 0;
    background: var(--white);
    position: relative;
  }

  /* Logo — from InDesign source (pt × 1.333 = px)
     Source: w 185.322pt → 247.04px, h 31.883pt → 42.50px
             x 56.693pt → 75.59px, y 56.372pt → 75.14px */
  .logo {
    position: absolute;
    left: 75.59px;
    top: 75.14px;
    line-height: 0;
  }

  .logo svg {
    width: 247.04px;
    height: 42.50px;
  }

  /* Content block — position derived from InDesign source (pt × 1.333 = px)
     Source: x 56.693pt → 75.59px, y 184.252pt → 245.67px */
  .cover-content {
    position: absolute;
    left: 75.59px;
    top: 245.67px;
    right: 75.59px;
  }

  /* 9pt × 1.333 = 12px */
  .overline {
    font-size: 12px;
    font-weight: 400;
    color: var(--black);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 18px;
    outline: none;
  }

  /* 15pt × 1.333 = 20px */
  .module-name {
    font-size: 20px;
    font-weight: 400;
    color: var(--black);
    line-height: 1.4;
    margin-bottom: 3px;
    outline: none;
  }

  /* 23pt × 1.333 = 30.67px — line-height from InDesign leading: 27pt × 1.333 = 35.99px */
  .headline {
    font-size: 30.67px;
    font-weight: 400;
    color: rgba(0, 0, 0, 0.7);
    line-height: 35.99px;
    outline: none;
  }

  /* ─── Bottom coloured section (52.5% = 590px) ───────── */

  .page-bottom {
    flex: 1;
    background: var(--cover-bg);
    position: relative;
  }

  /*
   * Module badge — white-background variant only.
   * Replace src with the correct module path:
   *   ../../images/modules/module-logos/[Category]/[MODULE]-white-background.svg
   *
   * Examples:
   *   Risk/ISMS-white-background.svg
   *   Compliance/DP-white-background.svg
   *   Risk/ERM-white-background.svg
   */
  /* Badge — position from InDesign source (pt × 1.333 = px)
     Source: w 222pt → 295.93px, h 222pt → 295.93px
             x 317.118pt → 422.89px (from page left)
             y 562.945pt → 750.81px (from page top) → 217.81px from bottom section top */
  .module-badge {
    position: absolute;
    left: 422.89px;
    top: 217.81px;
    width: 295.93px;
    height: 295.93px;
    object-fit: contain;
    display: block;
  }

  /* ─── Contenteditable indicators ────────────────────── */

  [contenteditable]:hover {
    outline: 1px dashed var(--border);
    border-radius: 2px;
    cursor: text;
  }

  [contenteditable]:focus {
    outline: 1px dashed var(--blue);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="page-wrapper" id="pageWrapper">
  <div class="page">

    <!-- White upper section -->
    <div class="page-top">

      <div class="logo"></div>

      <div class="cover-content">
        <div class="overline" contenteditable="true">Solution brief</div>
        <div class="module-name" contenteditable="true">Module full name</div>
        <div class="headline" contenteditable="true">Your compelling module headline goes here</div>
      </div>

    </div>

    <!-- Tinted lower section with module badge -->
    <div class="page-bottom">
      <img
        class="module-badge"
        src="../../../images/modules/module-logos/Risk/ISMS-white-background.svg"
        alt="Module badge"
      >
    </div>

  </div>
</div>

<script>
  // Responsive scaling — preserves A4 proportions
  function scalePage() {
    const s = Math.min(window.innerWidth / 794, window.innerHeight / 1123) * 0.92;
    document.getElementById('pageWrapper').style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', scalePage);
  scalePage();

  // Clone logo SVG into .logo div
  document.querySelectorAll('.logo').forEach(el => {
    el.appendChild(document.getElementById('logo-svg').content.cloneNode(true));
  });
</script>
